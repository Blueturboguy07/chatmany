# Update feed of the chatmany desktop app: for one GitHub release (tag desktop-vX.Y.Z), makes the files
# the self-updater reads (desktop/publik-updater.cjs, desktop/docs/updates.md):
#   latest.yml       + latest.yml.sig       Windows: the NSIS installer on the release
#   latest-mac.yml   + latest-mac.yml.sig   macOS: the zips (Squirrel.Mac installs from them) and the dmgs,
#                                           arm64 and x64; each Mac takes the files of its architecture
# The feed files carry ABSOLUTE asset URLs (https://github.com/<repo>/releases/download/<tag>/<file>), the
# sha512 of each file and `publikApp: chatmany`. The .sig files are minisign signatures made with the
# publik update key (repo secrets PUBLIK_UPDATE_KEY and PUBLIK_UPDATE_KEY_PASSWORD); each one is verified
# against the public key in desktop/publik-update-verify.cjs before upload. publik serves these four files
# at https://publikhq.com/api/updates/chatmany/ from the scan-approved release.
#
# Run it once the release (a draft is fine) holds the installer files. It adds only the feed files that
# are missing; "force" remakes them (after a file on the release was replaced). It never touches an
# installer. A push of this file runs only a self-check (sign and verify a scratch file with the update
# key); that also makes the workflow known to GitHub, so it can be started by hand on this branch.
name: desktop update feed

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. desktop-v0.1.2
        required: true
        type: string
      version:
        description: The version in the file names, when the tag says more (desktop-v0.1.2-rc1 -> 0.1.2)
        required: false
        type: string
        default: ''
      force:
        description: Remake feed files that already exist
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: false
        type: string
        default: ''
      force:
        required: false
        type: boolean
        default: false
  push:
    branches: [desktop-app, feat/desktop-updater]
    paths:
      - '.github/workflows/desktop-update-feed.yml'

permissions:
  contents: write

concurrency:
  group: desktop-update-feed-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: desktop

jobs:
  feed:
    name: Feed for ${{ inputs.tag || '(self-check)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Self-check (sign and verify a scratch file with the update key)
        if: ${{ !inputs.tag }}
        env:
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/selfcheck"; mkdir -p "$d"
          printf 'self-check %s\n' "$GITHUB_SHA" > "$d/latest.yml"
          node scripts/publik-update-feed.cjs sign "$d/latest.yml"

      - name: Make, sign, verify and upload the missing feed files
        if: ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          PUBLIK_UPDATE_KEY: ${{ secrets.PUBLIK_UPDATE_KEY }}
          PUBLIK_UPDATE_KEY_PASSWORD: ${{ secrets.PUBLIK_UPDATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^desktop-v[0-9A-Za-z.-]+$ ]] || { echo "The tag must look like desktop-v0.1.2."; exit 1; }
          node scripts/publik-update-feed.cjs release --tag "$TAG" --app chatmany --repo "$GITHUB_REPOSITORY" ${VERSION:+--version "$VERSION"} $FORCE
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort
