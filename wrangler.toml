# chatmany — Cloudflare Worker config
# After cloning: `wrangler d1 create chatmany`, paste the returned database_id below,
# then `npm run db:migrate:remote`. Secrets are set with `wrangler secret put` (see .env.example).

name = "chatmany"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Cron triggers (all free tier).
#  - every minute: poll comments + inbound messages for active campaigns
#  - daily 03:00 UTC: refresh the long-lived Instagram token if it is due
[triggers]
crons = ["* * * * *", "0 3 * * *"]

# D1 database. Replace database_id with the id printed by `wrangler d1 create chatmany`.
[[d1_databases]]
binding = "DB"
database_name = "chatmany"
database_id = "682c90a5-cb4f-446a-ae1c-a48f02b737a5"
migrations_dir = "schema"

# Web UI (Section 7A). Static files in ./public are served automatically; the Worker handles
# /api/*, /auth/*, and /webhook, and falls back to index.html for client-side routes (SPA).
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
# Public, non-secret configuration. Secrets (APP_SECRET, OWNER_TOKEN) go via `wrangler secret put`.
GRAPH_VERSION = "v23.0"
# "polling" (default, build target) or "webhook" (optional latency upgrade, Section 5B).
MODE = "polling"
# Seconds between comment/message polls. Cron granularity is 60s; larger values are honored
# via a last-run timestamp so we never over-poll and burn the shared rate budget.
POLL_INTERVAL_SECONDS = "90"
# Redirect URI registered in your Meta app. Must match exactly: https://<your-worker>/auth/callback
# You MUST change this before deploying — the placeholder is not a working URL.
REDIRECT_URI = "https://chatmany.blueturboguy07.workers.dev/auth/callback"
# "1" turns on multi-tenant hosting (publik's deployment only). Unset = self-host, unchanged.
# HOSTED = "1"
# publik API base the metered units are reported to.
# PUBLIK_API_BASE = "https://publikhq.com"

# ---------------------------------------------------------------- hosted mode
# Everything below is inert on a self-host deployment (HOSTED is unset, so the hosted routes
# answer 404 and the cron keeps polling this one account). publik's own deployment sets HOSTED=1
# and the five secrets listed in .env.example.

# One Durable Object per tenant: the tenant's comment queue, send pacing, poll slot, 613 cooldown
# and usage counters. This is why Cloudflare was chosen over cheaper per-event hosts — it is the
# only one of them with a native per-tenant single-threaded scheduler. See src/tenant/runner.ts.
[[durable_objects.bindings]]
name = "TENANT"
class_name = "TenantDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantDO"]
